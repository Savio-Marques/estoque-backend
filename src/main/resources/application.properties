# Constroi a URL de conexao a partir das partes individuais
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:estoque_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

# Configuracao do JPA e Flyway
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Configuracao do JWT
api.security.token.secret=${JWT_SECRET:secret-para-desenvolvimento-local}

# Porta do Servidor e suporte a Proxy Reverso HTTPS (Nginx)
server.port=${PORT:10000}
server.forward-headers-strategy=framework

# Conta Root (ADMIN) inicializada via variaveis de ambiente
app.security.admin.username=${ADMIN_USERNAME:}
app.security.admin.password=${ADMIN_PASSWORD:}
app.security.admin.name=${ADMIN_NAME:Administrador}
