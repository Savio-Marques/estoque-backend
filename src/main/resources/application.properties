# Constroi a URL de conexao a partir das partes individuais
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:estoque_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

# Configuracao do JPA (usa update por padrao localmente e permite sobrescrever via env)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuracao do JWT
api.security.token.secret=${JWT_SECRET:secret-para-desenvolvimento-local}

# Porta do Servidor
server.port=${PORT:10000}
