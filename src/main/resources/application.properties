# Constroi a URL de conexao a partir das partes individuais
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:estoque}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

# Configuracao do JPA para Producao
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuracao do JWT
api.security.token.secret=${JWT_SECRET:secret-para-desenvolvimento-local}

# Porta do Servidor
server.port=${PORT:10000}
