# Banco H2 em memória (sem MODE=PostgreSQL para evitar conflito com TINYINT do H2Dialect)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE,DATE,USER,ROLE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring cria as tabelas automaticamente nos testes
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# JWT para testes
api.security.token.secret=secret-para-testes-ci-cd-12345678
