# Banco H2 em memória (sem MODE=PostgreSQL para evitar conflito com TINYINT do H2Dialect)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring cria as tabelas automaticamente nos testes
spring.jpa.hibernate.ddl-auto=create-drop

# Sobrescreve explicitamente o dialeto do PostgreSQL definido no application.properties principal
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT para testes
api.security.token.secret=secret-para-testes-ci-cd-12345678
