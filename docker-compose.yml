version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: estoque-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-estoque_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-estoque_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - estoque-network

  api:
    image: saviomarques/estoque-backend:latest
    container_name: estoque-api
    restart: always
    ports:
      - "127.0.0.1:10000:10000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-estoque_db}
      - DB_USER=${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      - DB_PASS=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET forte (min 32 chars) no .env}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://buscapestoque.vercel.app}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NAME=${ADMIN_NAME:-Administrador}
      - JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - estoque-network

volumes:
  postgres_data:

networks:
  estoque-network:
